# Dependabot version updates. Security alerts and security updates are separate repository settings
# and do not depend on this file. Weekly, small batches, minor and patch changes grouped so a week
# is one pull request per ecosystem, and a major version arrives alone for a person to read.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend"]
    schedule:
      interval: "weekly"
      day: "monday"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
