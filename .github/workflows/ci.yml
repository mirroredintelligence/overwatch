# Continuous integration for the DIUCS capacity app.
# Runs all checks when started by hand (it was every push and pull request until the owner disabled it). Nothing here deploys anything.
#
# The back-end integration tests start their own throwaway Neo4j container per pytest session
# (DEC-008, harness from F10). This workflow therefore does not start infra/docker-compose.yml;
# it relies on the Docker daemon that GitHub-hosted ubuntu runners provide.

name: ci

# DISABLED by the owner's request (billing): the workflow runs only when started by hand
# (Actions tab, Run workflow). To turn push and pull-request runs back on, replace the line
# below with:  push:  and  pull_request:  (each on its own line under on:).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: backend static (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python 3.15 is a preview leg: its failure does not fail the workflow.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Import-linter contracts
        run: uv run lint-imports
        env:
          PYTHONIOENCODING: utf-8
      - name: Unit tests
        run: uv run pytest tests/unit

  backend:
    name: backend (full suite, Neo4j in Docker)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Docker available
        run: docker version
      - name: Full test suite, including integration
        run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
