[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diucs"
version = "0.1.0"
description = "DIUCS capacity back end"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "azure-servicebus>=7.15.0",
    "cryptography==50.0.2",
    "fastapi>=0.162.0",
    "fhir-resources>=8.3.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "rdflib>=7.6.0",
    "redis>=8.1.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker services in infra/",
    "emulator_limit: a case where the emulator refuses what the port allows; names the case, the emulator and the error (DEC-102)",
    "no_tenant: an integration test that runs with no tenant bound; the conftest binds the run tenant around every other one (TEN-003)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# D14 red tests were committed before this lint config was checked against them.
# Their assertions are left exactly as committed in ef5f9bb; these two rules are waived for that file only.
[tool.ruff.lint.per-file-ignores]
"tests/unit/domain/rules/test_booking_rules.py" = ["E501", "SIM300"]

[tool.mypy]
strict = true
files = ["src"]
