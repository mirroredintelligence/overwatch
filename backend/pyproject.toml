[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diucs"
version = "0.1.0"
description = "DIUCS capacity back end"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.3",
    "azure-identity>=1.25.0",
    "azure-keyvault-secrets>=4.10.0",
    "azure-monitor-query>=2.0.0",
    "azure-servicebus>=7.15.0",
    "cryptography==50.0.2",
    "fastapi>=0.162.0",
    "fhir-resources>=8.3.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pywebpush>=2.5.0",
    "rdflib>=7.6.0",
    "redis>=8.1.0",
    "tzdata>=2026.5",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
# Under pytest-xdist (-n) every test of a file runs on one worker: several modules depend on the order
# of their own tests, their module fixtures and the probes they leave behind (TEN-035).
addopts = "--dist loadfile"
markers = [
    "integration: needs the Docker services in infra/",
    "emulator_limit: a case where the emulator refuses what the port allows; names the case, the emulator and the error (DEC-102)",
    "schema: the test changes or asserts the Neo4j schema, so it runs on a private container (own_neo4j), never on the shared one (TEN-034)",
    "lifecycle: the test stops, starts or removes a Neo4j container, so it runs on a private container (own_neo4j) (TEN-034)",
    "exclusive: the test cannot share the machine with another run (it asserts about the whole database, or needs the compose stack or the Service Bus emulator); it runs in a session of its own, after the parallel one (TEN-034)",
    "servicebus: the test uses the Service Bus emulator, one for the whole machine (TEN-035)",
    "redis: the test uses the Redis of the compose project, which runs are separated on by key prefix (TEN-035)",
    "infra: the test needs the compose stack of the owner (Neo4j on 7687, the collector on 4318) (TEN-035)",
    "no_tenant: an integration test that runs with no tenant bound; the conftest binds the run tenant around every other one (TEN-003)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# D14 red tests were committed before this lint config was checked against them.
# Their assertions are left exactly as committed in ef5f9bb; these two rules are waived for that file only.
[tool.ruff.lint.per-file-ignores]
"tests/unit/domain/rules/test_booking_rules.py" = ["E501", "SIM300"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# pywebpush ships no type information (I14). Its one call is wrapped by WebPushSender, which types
# every value it passes in and out.
module = ["pywebpush", "pywebpush.*"]
ignore_missing_imports = true
