[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diucs"
version = "0.1.0"
description = "DIUCS capacity back end"
requires-python = ">=3.14"
dependencies = [
    "azure-servicebus>=7.15.0",
    "fhir-resources>=8.3.0",
    "neo4j>=6.4.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the Docker services in infra/"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
