<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home and splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes ring{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dot{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width:1280px;height:800px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#14232B;overflow:hidden">

  <section aria-label="Home" style="background:#EEF2F3;display:flex;align-items:center;justify-content:center;padding:48px">
    <div style="width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center">
      <div style="display:flex;align-items:center;gap:16px">
        <span style="width:72px;height:72px;border-radius:22px;background:#0B2A3D;display:flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="13" cy="13" r="4.2" fill="#fff"/><path d="M3 13h20" stroke="#fff" stroke-width="2.4"/></svg></span>
        <h1 style="margin:0;font-size:48px;letter-spacing:-.01em">Overwatch</h1>
      </div>
      <p style="margin:0;font-size:21px;line-height:1.45;color:#26343B">The live picture of which urgent care services can take a patient right now.</p>
      <a href="#" style="display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;height:64px;border-radius:18px;background:#0B5C8C;color:#fff;font-size:21px;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(11,92,140,.3)">Sign in</a>
      <a href="#" style="font-size:16px;color:#44555D;font-weight:700">Platform console</a>
    </div>
  </section>

  <section aria-label="Splash" style="background:#0B2A3D;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:28px;position:relative">
    <div style="position:relative;width:180px;height:180px">
      <svg width="180" height="180" viewBox="0 0 26 26" aria-hidden="true" style="animation:ring 900ms cubic-bezier(0.34,1.56,0.64,1) both"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M3 13h20" stroke="#fff" stroke-width="1.6"/><circle cx="13" cy="13" r="4.2" fill="#0B5C8C" style="transform-origin:13px 13px;animation:dot 700ms 500ms cubic-bezier(0.34,1.56,0.64,1) both"/></svg>
    </div>
    <div style="font-size:30px;font-weight:700;color:#fff;letter-spacing:-.005em">Overwatch</div>
    <div style="position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:15px;color:#9FC3D6">Splash: shown once as the app opens. The ring settles with one small spring, then it hands over.</div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
