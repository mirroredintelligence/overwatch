<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width:84px;height:800px;box-sizing:border-box;flex:none;background:#0B2A3D;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:4px;font-family:'Atkinson Hyperlegible',system-ui,sans-serif">
  <div style="width:44px;height:44px;border-radius:14px;background:#0B5C8C;display:flex;align-items:center;justify-content:center;margin-bottom:14px">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="13" cy="13" r="4.2" fill="#fff"/><path d="M3 13h20" stroke="#fff" stroke-width="2.4"/></svg>
  </div>
  <sc-for list="{{items}}" as="i" hint-placeholder-count="9">
    <a href="#" aria-current="{{ i.current }}" style="{{ i.style }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ i.d }}"/></svg>{{ i.label }}</a>
  </sc-for>
  <a href="#" style="margin-top:auto;width:68px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#B9D0DC;text-decoration:none;font-size:13px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>Help</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"portal":{"editor":"enum","default":"admin","options":["admin","operator"]},"active":{"editor":"text","default":"overview"},"$preview":{"width":84,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const portal = this.props.portal || 'admin';
    const active = this.props.active || 'overview';
    const ICON = {
      home: 'M4 11l8-7 8 7v9H4z',
      people: 'M9 11a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM3 20a6 6 0 0 1 12 0M16 5.2a3.2 3.2 0 0 1 0 6M18 20a6 6 0 0 0-3-5.2',
      mail: 'M4 5h16v14H4zM4 9l8 5 8-5',
      sliders: 'M4 7h10M18 7h2M4 17h2M10 17h10M16 4v6M8 14v6',
      db: 'M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3zM5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6',
      send: 'M21 4L10 14M21 4l-6 17-4-7-7-4z',
      share: 'M8 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0zM22 5a3 3 0 1 0-6 0 3 3 0 0 0 6 0zM22 19a3 3 0 1 0-6 0 3 3 0 0 0 6 0zM8 11l8-5M8 13l8 5',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      buoy: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM5.6 5.6l3.2 3.2M15.2 15.2l3.2 3.2M18.4 5.6l-3.2 3.2M8.8 15.2l-3.2 3.2',
      building: 'M4 21V5l8-2v18M12 21V9l8 2v10M8 9h.01M8 13h.01M8 17h.01M16 14h.01M16 18h.01',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'
    };
    const SETS = {
      admin: [
        ['overview', 'Overview', 'home'], ['people', 'People', 'people'], ['contacts', 'Contacts', 'mail'],
        ['settings', 'Settings', 'sliders'], ['retention', 'Retention', 'db'], ['email', 'Email', 'send'],
        ['sharing', 'Sharing', 'share'], ['access', 'Access', 'shield'], ['support', 'Support', 'buoy']
      ],
      operator: [['orgs', 'Organisations', 'building'], ['support', 'Support', 'buoy'], ['audit', 'Audit', 'list']]
    };
    const items = (SETS[portal] || SETS.admin).map(([key, label, icon]) => {
      const on = key === active;
      return {
        label,
        d: ICON[icon],
        current: on ? 'page' : undefined,
        style: 'width:68px;padding:9px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:13px;color:' + (on ? '#fff' : '#B9D0DC') + ';font-weight:' + (on ? '700' : '400') + ';background:' + (on ? 'rgba(255,255,255,.14)' : 'transparent')
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
