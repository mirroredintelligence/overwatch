<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
@property --sk-sweep{syntax:'<number>';inherits:true;initial-value:-0.3}
@keyframes sk-sweep{to{--sk-sweep:1.3}}
html:has([data-skeleton]){animation:sk-sweep 1.7s linear infinite}
@media (prefers-reduced-motion: reduce){html:has([data-skeleton]){animation:none}}
.sk{--b:#E1E7E9;--h:#F7FAFB;--p:calc(var(--sk-sweep) * 100vw);display:block;background-color:var(--b);background-image:linear-gradient(100deg,var(--b) calc(var(--p) - 14vw),var(--h) var(--p),var(--b) calc(var(--p) + 14vw));background-attachment:fixed;border-radius:10px}
.app{width:1280px;height:800px;display:flex;background:#EEF2F3;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#14232B;overflow:hidden}
.rail{width:84px;flex:none;background:#0B2A3D;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:6px}
.lg{width:44px;height:44px;border-radius:14px;background:#0B5C8C;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.ri{width:68px;padding:10px 0 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#B9D0DC;text-decoration:none;font-size:13px}
.ri.on{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:72px;flex:none;display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid #DDE3E6;background:#fff}
.role{margin-left:auto;height:44px;padding:0 16px;border:2px solid #14232B;border-radius:999px;background:#fff;color:#14232B;font:700 16px 'Atkinson Hyperlegible',system-ui,sans-serif;display:flex;align-items:center;gap:8px}
.tile{box-sizing:border-box;height:168px;background:#fff;border:3px solid #DDE3E6;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="lg"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="13" cy="13" r="4.2" fill="#fff"/><path d="M3 13h20" stroke="#fff" stroke-width="2.4"/></svg></div>
    <a class="ri" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Calls</a>
    <a class="ri on" href="#" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Board</a>
    <a class="ri" href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Services</a>
    <a class="ri" href="#" style="margin-top:auto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>Help</a>
  </nav>
  <div class="col">
    <header class="top">
      <div style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:14px;color:#44555D">Urgent care capacity</span><span style="font-size:20px;font-weight:700">Advisor</span></div>
      <button type="button" class="role">Clinical advisor <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <main style="flex:1;min-height:0;padding:22px 28px 18px;display:flex;flex-direction:column;gap:14px" aria-busy="true">
      <div style="display:flex;align-items:flex-end;justify-content:space-between">
        <div><h1 style="margin:0;font-size:30px;line-height:1.1">Board right now</h1><div style="margin-top:8px"><span class="sk" style="width:420px;height:16px"></span></div></div>
        <span class="sk" style="width:190px;height:56px;border-radius:16px"></span>
      </div>
      <div role="status" data-skeleton><span class="sr">Loading the board.</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px" aria-hidden="true">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
          <div class="tile">
            <div style="display:flex;justify-content:space-between;gap:12px">
              <div style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="width:{{ t.w }}%;height:20px"></span><span class="sk" style="width:46%;height:14px"></span></div>
              <span class="sk" style="width:104px;height:26px;border-radius:999px"></span>
            </div>
            <span class="sk" style="width:38%;height:42px"></span>
            <span class="sk" style="width:100%;height:8px;border-radius:4px"></span>
            <span class="sk" style="width:62%;height:14px"></span>
          </div>
        </sc-for>
      </div>
      <div style="font-size:16px;color:#44555D">This takes a moment. If it takes longer than 10 seconds, the board says so and offers to try again.</div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { tiles: [62, 48, 70, 56, 80, 66, 52, 74, 44].map((w) => ({ w })) };
  }
}
</script>
</body>
</html>
