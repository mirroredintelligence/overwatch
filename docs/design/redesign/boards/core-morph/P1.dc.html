<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone needs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;background:#EEF2F3;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#14232B;overflow:hidden">

  <header style="height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0B2A3D;color:#fff">
    <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="13" cy="13" r="4.2" fill="#fff"/><path d="M3 13h20" stroke="#fff" stroke-width="2.4"/></svg>Overwatch</div>
    <button type="button" style="height:40px;padding:0 12px;border:2px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-family:inherit;font-weight:700;font-size:15px">Advisor ▾</button>
  </header>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px">
    <span style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#E3F1F8;color:#0B3F61;font-weight:700;font-size:15px"><span style="width:8px;height:8px;border-radius:50%;background:#0B5C8C"></span>On call 02:14</span>
    <span style="font-size:15px;color:#44555D">Step 1 of 4</span>
  </div>
  <div style="display:flex;gap:6px;padding:6px 16px 10px" aria-hidden="true">
    <span style="flex:1;height:6px;border-radius:3px;background:#0B5C8C"></span><span style="flex:1;height:6px;border-radius:3px;background:#C9DCE6"></span><span style="flex:1;height:6px;border-radius:3px;background:#C9DCE6"></span><span style="flex:1;height:6px;border-radius:3px;background:#C9DCE6"></span>
  </div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;font-size:26px">Patient needs</h1>
    <div style="background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,35,43,.06),0 8px 22px rgba(20,35,43,.06)">
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:17px">Age</div>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
          <span style="padding:12px 0;text-align:center;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:15px">0–15</span>
          <span style="padding:12px 0;text-align:center;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:15px">16–64</span>
          <span style="padding:12px 0;text-align:center;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:15px">65–79</span>
          <span style="padding:12px 0;text-align:center;border:2px solid #0B5C8C;background:#E3F1F8;border-radius:12px;font-weight:700;font-size:15px">80+</span>
        </div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:17px">Postcode</div>
        <div style="height:52px;border:2px solid #26343B;border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:19px">DT4 8XX</div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:17px">What do they need?</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <span style="padding:11px 14px;border:2px solid #0B5C8C;background:#E3F1F8;border-radius:12px;font-weight:700;font-size:16px">Fall, no injury</span>
          <span style="padding:11px 14px;border:2px solid #0B5C8C;background:#E3F1F8;border-radius:12px;font-weight:700;font-size:16px">Frailty</span>
          <span style="padding:11px 14px;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:16px">IV therapy</span>
          <span style="padding:11px 14px;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:16px">Wound care</span>
          <span style="padding:11px 14px;border:2px dashed #6B7B83;border-radius:12px;font-weight:700;font-size:16px">More ▾</span>
        </div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;font-size:17px">How soon</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
          <span style="padding:12px 0;text-align:center;border:2px solid #0B5C8C;background:#E3F1F8;border-radius:12px;font-weight:700;font-size:15px">2 hrs</span>
          <span style="padding:12px 0;text-align:center;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:15px">Today</span>
          <span style="padding:12px 0;text-align:center;border:2px solid #DDE3E6;border-radius:12px;font-weight:700;font-size:15px">Planned</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid #DDE3E6;padding-top:12px;font-size:16px;color:#26343B"><span>Score from the referrer (optional)</span><span style="font-weight:700">▾</span></div>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 16px 20px;background:linear-gradient(180deg,rgba(238,242,243,0),#EEF2F3 28%)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:16px"><span style="color:#26343B">Matching so far</span><span style="font-weight:700;color:#0B3F61;font-size:22px">3 services</span></div>
    <button type="button" style="width:100%;height:58px;border:0;border-radius:16px;background:#0B5C8C;color:#fff;font-family:inherit;font-size:19px;font-weight:700;box-shadow:0 6px 16px rgba(11,92,140,.28)">See the options</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
