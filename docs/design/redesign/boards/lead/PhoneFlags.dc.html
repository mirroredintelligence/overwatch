<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone reports to check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.ph{width:390px;height:844px;position:relative;background:#EEF2F3;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#14232B;overflow:hidden}
.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0B2A3D;color:#fff}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(20,35,43,.06),0 8px 22px rgba(20,35,43,.06)}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;height:68px;background:#fff;border-top:1px solid #DDE3E6}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:#44555D;min-width:64px}
</style>
</helmet>
<div class="ph">
  <header class="bar">
    <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="13" cy="13" r="4.2" fill="#fff"/><path d="M3 13h20" stroke="#fff" stroke-width="2.4"/></svg>Overwatch</div>
    <button type="button" style="height:40px;padding:0 12px;border:2px solid rgba(255,255,255,.7);border-radius:999px;background:transparent;color:#fff;font-family:inherit;font-weight:700;font-size:15px">Shift lead ▾</button>
  </header>

  <div style="padding:14px 16px 8px"><h1 style="margin:0;font-size:26px">Reports to check</h1></div>
  <div style="display:flex;gap:8px;padding:0 16px 12px" role="tablist" aria-label="Reports">
    <span role="tab" aria-selected="true" style="height:44px;padding:0 18px;border-radius:999px;background:#0B5C8C;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px">To check <b>3</b></span>
    <span role="tab" aria-selected="false" style="height:44px;padding:0 18px;border-radius:999px;background:#fff;border:2px solid #DDE3E6;font-weight:700;font-size:16px;display:flex;align-items:center">Checked</span>
  </div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <section class="card" aria-label="UCR East" style="border:2px solid #0B5C8C;display:flex;flex-direction:column;gap:10px">
      <div><div style="font-size:20px;font-weight:700">UCR East</div><div style="font-size:15px;color:#26343B;margin-top:2px">The figure changed many times in a short time.</div></div>
      <div style="display:flex;align-items:flex-end;gap:12px;background:#F4F6F5;border-radius:14px;padding:10px 14px">
        <div style="text-align:center"><b style="font-size:22px;color:#0B3F61">4</b><div style="font-size:12px;color:#44555D">13:04</div></div>
        <div style="text-align:center"><b style="font-size:22px;color:#0B3F61">0</b><div style="font-size:12px;color:#44555D">13:12</div></div>
        <div style="text-align:center"><b style="font-size:22px;color:#0B3F61">5</b><div style="font-size:12px;color:#44555D">13:21</div></div>
        <div style="text-align:center"><b style="font-size:22px;color:#0B3F61">1</b><div style="font-size:12px;color:#44555D">13:33</div></div>
        <div style="text-align:center"><b style="font-size:22px;color:#0B3F61">4</b><div style="font-size:12px;color:#44555D">13:52</div></div>
      </div>
      <button type="button" style="height:56px;border:0;border-radius:14px;background:#0B5C8C;color:#fff;font-family:inherit;font-size:18px;font-weight:700;box-shadow:0 6px 16px rgba(11,92,140,.24)">Phone to confirm</button>
      <div style="display:flex;gap:8px"><button type="button" style="flex:1;height:48px;border:2px solid #0B5C8C;border-radius:14px;background:#fff;color:#0B5C8C;font-family:inherit;font-size:16px;font-weight:700">Mark as checked</button><button type="button" style="flex:1;height:48px;border:0;border-radius:14px;background:#F4F6F5;color:#14232B;font-family:inherit;font-size:16px;font-weight:700">Suspend</button></div>
    </section>

    <section class="card" aria-label="SDEC Site 2" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700">SDEC · Site 2</div><div style="font-size:14px;color:#44555D">Out of its usual range twice</div></div><span style="font-size:22px;color:#44555D" aria-hidden="true">›</span></section>
    <section class="card" aria-label="Virtual ward" style="display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:18px;font-weight:700">Virtual ward · frailty</div><div style="font-size:14px;color:#44555D">Differs from what advisors phoned</div></div><span style="font-size:22px;color:#44555D" aria-hidden="true">›</span></section>
  </div>

  <nav class="nav" aria-label="Shift lead">
    <span class="ni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Shift</span>
    <span class="ni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Phones</span>
    <span class="ni" style="color:#0B5C8C;font-weight:700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg>Flags</span>
    <span class="ni"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
